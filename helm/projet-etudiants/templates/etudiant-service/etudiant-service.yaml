apiVersion: apps/v1
kind: Deployment
metadata:
  name: etudiant-service
  labels:
    app: etudiant-service
    {{- include "projet-etudiants.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.etudiantService }}
  selector:
    matchLabels:
      app: etudiant-service
  template:
    metadata:
      labels:
        app: etudiant-service
    spec:
      containers:
        - name: etudiant-service
          image: "{{ .Values.images.etudiantService.repository }}:{{ .Values.images.etudiantService.tag }}"
          imagePullPolicy: {{ .Values.images.etudiantService.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              {{- if .Values.postgres.external }}
              value: "jdbc:postgresql://{{ .Values.postgres.externalHost }}:5432/{{ .Values.postgres.database }}"
              {{- else }}
              value: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}"
              {{- end }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              {{- if .Values.redis.external }}
              value: "{{ .Values.redis.externalHost }}"
              {{- else }}
              value: "redis"
              {{- end }}
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.etudiantService | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: etudiant-service
  labels:
    app: etudiant-service
spec:
  selector:
    app: etudiant-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
