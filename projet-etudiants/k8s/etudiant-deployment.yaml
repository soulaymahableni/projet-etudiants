---
apiVersion: v1
kind: Service
metadata:
  name: etudiant-service
  labels:
    app: etudiant-service
spec:
  selector:
    app: etudiant-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etudiant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etudiant-service
  template:
    metadata:
      labels:
        app: etudiant-service
    spec:
      containers:
        - name: etudiant-service
          # Remplacer <votre-username> par votre identifiant Docker Hub apres push
          image: <votre-username>/etudiant-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/etudiants
            - name: SPRING_DATASOURCE_USERNAME
              value: etudiants
            - name: SPRING_DATASOURCE_PASSWORD
              value: etudiants
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: EUREKA_REGISTER
              value: "false"
            - name: EUREKA_FETCH
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
