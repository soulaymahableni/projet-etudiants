# Docker Compose unifie - orchestration de tous les microservices
# Demarrage : docker compose up --build

services:

  # ----- Bases de donnees -----
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: etudiants
      POSTGRES_USER: etudiants
      POSTGRES_PASSWORD: etudiants
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etudiants"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notes:
    image: postgres:15-alpine
    container_name: postgres-notes
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    ports:
      - "5433:5432"
    volumes:
      - postgres_notes_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net

  # ----- Eureka registry -----
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-net

  # ----- Microservices metier -----
  etudiant-service:
    build: ./api-spring-boot
    container_name: etudiant-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/etudiants
      SPRING_DATASOURCE_USERNAME: etudiants
      SPRING_DATASOURCE_PASSWORD: etudiants
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - app-net

  grading-service:
    build: ./grading-service
    container_name: grading-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notes:5432/notes
      SPRING_DATASOURCE_USERNAME: notes
      SPRING_DATASOURCE_PASSWORD: notes
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      - postgres-notes
      - eureka-server
    networks:
      - app-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/authdb
      JWT_SECRET: change-me-in-production
      PORT: 3001
    depends_on:
      - mongodb
    networks:
      - app-net

  # ----- API Gateway -----
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      - eureka-server
      - etudiant-service
      - grading-service
    networks:
      - app-net

  # ----- Frontend -----
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - app-net

volumes:
  postgres_data:
  postgres_notes_data:
  mongo_data:

networks:
  app-net:
    driver: bridge
